<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusMate GCal Overlay</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-size: 14px;
      margin: 0;
    }
    h1 {
      margin: 0 0 16px 0;
      font-size: 18px;
      font-weight: 600;
    }
    .status {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .status.authenticated {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .status.not-authenticated {
      background: #fff3e0;
      color: #e65100;
    }
    .status.error {
      background: #ffebee;
      color: #c62828;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button:hover {
      background: #1565c0;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .secondary-button {
      background: #757575;
    }
    .secondary-button:hover {
      background: #616161;
    }
    .info {
      font-size: 12px;
      color: #666;
      margin-top: 12px;
      line-height: 1.5;
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>FocusMate GCal Overlay</h1>
  <div id="status" class="status loading">Loading...</div>
  <div id="buttons">
    <button id="authButton" disabled>Sign in to Google Calendar</button>
    <button id="optionsButton" class="secondary-button">Open Options</button>
  </div>
  <div class="info">
    The extension works automatically on Focusmate pages. Visit <a href="https://app.focusmate.com" target="_blank">app.focusmate.com</a> to see the calendar overlay.
  </div>
  <script src="dist/popup.js"></script>
</body>
</html>
