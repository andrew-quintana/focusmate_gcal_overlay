<!DOCTYPE html>
<html>
<head>
  <title>Focusmate Calendar View</title>
</head>
<body>
  <div class="calendar-container">
    <div class="session-block" data-session-time="10:00 AM - 10:25 AM">
      <div class="session-time">10:00 AM - 10:25 AM</div>
      <div class="session-title">Morning Focus Session</div>
      <div class="session-partner">Partner: John Doe</div>
    </div>
    
    <div class="session-block" data-session-time="2:00 PM - 2:25 PM">
      <div class="session-time">2:00 PM - 2:25 PM</div>
      <div class="session-title">Afternoon Focus Session</div>
      <div class="session-partner">Partner: Jane Smith</div>
    </div>
    
    <div class="session-block" data-session-time="4:00 PM - 4:25 PM">
      <div class="session-time">4:00 PM - 4:25 PM</div>
      <div class="session-title">Evening Focus Session</div>
    </div>
  </div>
</body>
</html>
